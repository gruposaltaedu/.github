name: 🚨 Lint

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        required: false
        default: "22.14"
      pnpm-version:
        description: pnpm version
        type: string
        required: false
        default: "10.6.5"
      lint-command:
        description: Fallback command when only-changed is false or event is not a pull_request
        type: string
        required: false
        default: "pnpm lint"
      only-changed:
        description: Lint only files changed in the pull request
        type: boolean
        required: false
        default: true
    secrets:
      GH_TOKEN:
        required: true

jobs:
  lint:
    name: Run lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      HUSKY: "0"
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup pnpm and Node
        uses: gruposaltaedu/.github/.github/actions/setup-pnpm-node@main
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          token: ${{ secrets.GH_TOKEN }}

      - name: 🧹 Run lint
        env:
          ONLY_CHANGED: ${{ inputs.only-changed }}
          LINT_COMMAND: ${{ inputs.lint-command }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$ONLY_CHANGED" != "true" ] || [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Running full lint command: $LINT_COMMAND"
            eval "$LINT_COMMAND"
            exit 0
          fi

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "Missing PR SHAs; falling back to full lint."
            eval "$LINT_COMMAND"
            exit 0
          fi

          # Match pre-commit/lint-staged: eslint on changed source files (not ng lint).
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}...${HEAD_SHA}" \
              | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' \
              | grep -vE '(^|/)(dist|coverage|node_modules)/' \
              || true
          )

          EXISTING=()
          for f in "${FILES[@]}"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              EXISTING+=("$f")
            fi
          done

          if [ ${#EXISTING[@]} -eq 0 ]; then
            echo "No lintable files changed in this PR."
            exit 0
          fi

          echo "Linting ${#EXISTING[@]} changed file(s) with eslint:"
          printf ' - %s\n' "${EXISTING[@]}"

          pnpm exec eslint --no-error-on-unmatched-pattern "${EXISTING[@]}"
